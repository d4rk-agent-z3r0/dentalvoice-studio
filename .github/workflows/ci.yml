name: CI

on:
  push:
    branches: [main, "feat/**"]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (lint, types, unit, integration)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: dentalvoice
          POSTGRES_DB: dentalvoice_test
          # Ephemeral, runner-local service: no password stored in the repo.
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U dentalvoice -d dentalvoice_test"
          --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql+asyncpg://dentalvoice@localhost:5432/dentalvoice_test
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@v8.2.0
        with:
          version: "0.11.32"
          enable-cache: true
          cache-dependency-glob: backend/uv.lock
      - run: uv sync --frozen
      - name: SPDX headers on original source files
        run: python3 ../scripts/add_spdx_headers.py --check
      - name: Ruff (backend and scripts)
        run: |
          uv run ruff check --config pyproject.toml . ../scripts
          uv run ruff format --config pyproject.toml --check . ../scripts
      - name: mypy (strict, backend and scripts)
        run: uv run mypy && uv run mypy --strict ../scripts
      - name: Unit tests
        run: uv run pytest -m "not integration" --cov --cov-report=term
      - name: Tooling tests (compliance scripts)
        run: uv run pytest ../scripts/tests
      - name: Integration tests (PostgreSQL 16)
        run: uv run pytest -m integration

  frontend:
    name: Frontend (lint, types, unit, build)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v6
        with:
          package_json_file: frontend/package.json
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build

  images:
    name: Container images build
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - name: Validate compose file
        env:
          POSTGRES_PASSWORD: compose-config-validation-only
        run: docker compose config --quiet
      - run: docker build -t dentalvoice-backend ./backend
      - run: docker build -t dentalvoice-frontend ./frontend
