# Local development stack. Copy .env.example to .env first; compose refuses to start without a
# database password so no credential default ever lives in this file.
name: dentalvoice

# Least-privilege defaults for application containers (both images already run as uid 10001).
x-hardened: &hardened
  read_only: true
  cap_drop: [ALL]
  security_opt: ["no-new-privileges:true"]

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-dentalvoice}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:-dentalvoice}
    volumes:
      - db-data:/var/lib/postgresql/data
      # Creates the disposable <db>_test database used by integration tests (first start only).
      - ./scripts/db/init:/docker-entrypoint-initdb.d:ro
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      # TCP, not the Unix socket: during first-start init the entrypoint runs a temporary
      # socket-only server that pg_isready would otherwise report as ready.
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s

  backend:
    <<: *hardened
    build: ./backend
    environment:
      ENVIRONMENT: ${ENVIRONMENT:-development}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      VOICE_PROVIDER_MODE: ${VOICE_PROVIDER_MODE:-mock}
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-dentalvoice}:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}@db:5432/${POSTGRES_DB:-dentalvoice}
      CORS_ORIGINS: '["http://localhost:3000"]'
    tmpfs:
      - /tmp
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "127.0.0.1:8000:8000"

  frontend:
    <<: *hardened
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_API_BASE_URL: ${NEXT_PUBLIC_API_BASE_URL:-http://localhost:8000}
    tmpfs:
      - /tmp
      - /app/.next/cache:mode=1777
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "127.0.0.1:3000:3000"

volumes:
  db-data:
